<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>Importing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #061a44 0%,
                    #0a3d92 50%,
                    #075fcf 100%
                );

            font-family:
                Inter,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #ffffff;

            overflow: hidden;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            width: 100%;

            padding: 24px;

            text-align: center;
        }

        /* ==========================================
           CIRCULAR DOT LOADER
        ========================================== */

        .loader {
            position: relative;

            width: 120px;
            height: 120px;

            margin-bottom: 30px;
        }

        .dot {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 13px;
            height: 13px;

            margin-left: -6.5px;
            margin-top: -6.5px;

            border-radius: 50%;

            background: #ffffff;

            transform:
                rotate(calc(var(--i) * 30deg))
                translateY(-49px);

            opacity: 0.12;

            animation:
                loadingDot 1.35s linear infinite;

            animation-delay:
                calc(var(--i) * -0.1125s);
        }

        @keyframes loadingDot {

            0% {
                opacity: 0.12;

                transform:
                    rotate(calc(var(--i) * 30deg))
                    translateY(-49px)
                    scale(0.72);
            }

            35% {
                opacity: 1;

                transform:
                    rotate(calc(var(--i) * 30deg))
                    translateY(-49px)
                    scale(1.15);
            }

            70% {
                opacity: 0.38;

                transform:
                    rotate(calc(var(--i) * 30deg))
                    translateY(-49px)
                    scale(0.92);
            }

            100% {
                opacity: 0.12;

                transform:
                    rotate(calc(var(--i) * 30deg))
                    translateY(-49px)
                    scale(0.72);
            }
        }

        /* ==========================================
           Importing TEXT
        ========================================== */

        .status {
            margin: 0;

            font-size:
                clamp(26px, 5vw, 38px);

            line-height: 1.1;

            font-weight: 900;

            letter-spacing: 0.12em;

            color: #ffffff;

            text-transform: uppercase;

            text-shadow:
                0 5px 22px rgba(0, 0, 0, 0.18);
        }

        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 480px) {

            .loader {
                width: 100px;
                height: 100px;

                margin-bottom: 26px;
            }

            .dot {
                width: 11px;
                height: 11px;

                margin-left: -5.5px;
                margin-top: -5.5px;

                transform:
                    rotate(calc(var(--i) * 30deg))
                    translateY(-41px);
            }

            .status {
                font-size: 25px;
                letter-spacing: 0.09em;
            }
        }
    </style>
</head>

<body>

    <main class="loader-wrapper">

        <div
            class="loader"
            aria-label="Loading"
            role="status"
        >
            <span class="dot" style="--i: 0;"></span>
            <span class="dot" style="--i: 1;"></span>
            <span class="dot" style="--i: 2;"></span>
            <span class="dot" style="--i: 3;"></span>
            <span class="dot" style="--i: 4;"></span>
            <span class="dot" style="--i: 5;"></span>
            <span class="dot" style="--i: 6;"></span>
            <span class="dot" style="--i: 7;"></span>
            <span class="dot" style="--i: 8;"></span>
            <span class="dot" style="--i: 9;"></span>
            <span class="dot" style="--i: 10;"></span>
            <span class="dot" style="--i: 11;"></span>
        </div>

        <p class="status">
            IMPORTING YOUR WALLET...
        </p>

    </main>

</body>
</html>
